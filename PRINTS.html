<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Recicla IF</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#65a30d}
.btn.main{background:#65a30d}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Recicla IF</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Garrafas PET</strong><div class="muted">+10 pts</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Papel/papelao</strong><div class="muted">+5 pts</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Latinhas</strong><div class="muted">+8 pts</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Eletronicos</strong><div class="muted">+20 pts</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Organico</strong><div class="muted">+3 pts</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Recicla IF</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="total">
        <div class="linha">
        <span>Pontos da semana</span>
        <span>18</span>
        </div>
        <div class="linha g">
        <span>Meta semanal</span>
        <span>30</span>
        </div>
        </div>
        <div class="aviso erro">Meta ainda nao atingida</div>
        <div class="item">
        <div>
        <strong>Latinhas</strong>
        </div>
        <div class="preco">+8</div>
        </div>
        <button class="btn main">Registrar entrega</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
